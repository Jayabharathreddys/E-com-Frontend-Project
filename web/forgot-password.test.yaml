fileType: momentic/test/v2
id: jbe-forgot-password-otp-flow
version: 1.0.0
description: Forgot password page renders and shows error for unknown email
defaultEnv: jbe
disabled: false
viewport: 1920, 1080
browserType: Chromium
steps:
  - navigate: "{{env.BASE_URL}}/forgot-password"
  - assert: An email input field and a Send OTP button are visible on the page
  - type:
      text: nobody_xyz@nonexistent.com
      into: email input
      clear: inputs
  - click: Send OTP button
  - assert: An error message is visible indicating no user was found with that email
